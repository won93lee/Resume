<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harold F. — IT Operations & Portfolio Governance</title>
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    .logo-heading {
      font-family: var(--font-heading);
    }
  </style>
</head>
<body class="relative min-h-screen overflow-hidden bg-black text-black">

  <!-- Background video -->
  <video
    id="bg-video"
    class="fixed inset-0 z-0 h-full w-full object-cover"
    style="object-position: 70% center"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
    muted
    playsinline
    preload="auto"
  ></video>

  <!-- Subtle overlay for text readability -->
  <div class="pointer-events-none fixed inset-0 z-[1] bg-black/20"></div>

  <!-- Navbar -->
  <nav class="fixed top-0 z-10 flex w-full items-center justify-between px-5 py-4 sm:px-8 sm:py-5">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <span class="logo-heading text-[21px] tracking-tight text-black sm:text-[26px]">Harold F.®</span>
      <span class="select-none text-[25px] text-black sm:text-[30px]" style="letter-spacing: -0.02em">✳︎</span>
    </div>

    <!-- Desktop nav links -->
    <div class="hidden items-center text-[23px] text-black md:flex">
      <a href="#experience" class="transition-opacity hover:opacity-60">Experience</a>
      <span class="mx-1 text-black/60">,</span>
      <a href="#skills" class="transition-opacity hover:opacity-60">Skills</a>
      <span class="mx-1 text-black/60">,</span>
      <a href="#education" class="transition-opacity hover:opacity-60">Education</a>
      <span class="mx-1 text-black/60">,</span>
      <a href="#certifications" class="transition-opacity hover:opacity-60">Certifications</a>
    </div>

    <!-- Desktop CTA -->
    <a
      href="#contact"
      id="desktop-contact"
      class="hidden text-[23px] text-black underline underline-offset-2 transition-opacity hover:opacity-60 md:inline"
    >Contact me</a>

    <!-- Mobile hamburger -->
    <button id="hamburger" class="flex flex-col gap-[5px] md:hidden" aria-label="Toggle menu">
      <span id="bar-top" class="h-[2px] w-6 bg-black transition-all duration-300"></span>
      <span id="bar-mid" class="h-[2px] w-6 bg-black transition-all duration-300"></span>
      <span id="bar-bot" class="h-[2px] w-6 bg-black transition-all duration-300"></span>
    </button>
  </nav>

  <!-- Mobile overlay -->
  <div
    id="mobile-menu"
    class="fixed inset-0 z-[9] flex flex-col justify-center gap-8 bg-white/95 px-8 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 md:hidden"
  >
    <a href="#experience" class="mobile-link text-[32px] font-medium text-black">Experience</a>
    <a href="#skills" class="mobile-link text-[32px] font-medium text-black">Skills</a>
    <a href="#education" class="mobile-link text-[32px] font-medium text-black">Education</a>
    <a href="#certifications" class="mobile-link text-[32px] font-medium text-black">Certifications</a>
    <button id="mobile-contact" class="text-left text-[32px] font-medium text-black underline underline-offset-2">Contact me</button>
  </div>

  <!-- Hero -->
  <section class="relative z-[1] flex h-screen flex-col overflow-hidden px-5 pb-12 sm:px-8 md:justify-center md:px-10 md:pb-0">
    <div class="relative z-10 mt-auto max-w-xl md:mt-0">
      <!-- Blurred intro -->
      <div
        class="pointer-events-none mb-5 select-none sm:mb-6"
        style="font-size: clamp(18px, 4vw, 26px); line-height: 1.3; font-weight: 400; color: #000; filter: blur(4px);"
      >
        Hey there, meet Harold F.,
        <br />
        IT Operations &amp; Portfolio Governance Leader
      </div>

      <!-- Typewriter -->
      <p
        id="typewriter"
        class="mb-5 text-black sm:mb-6"
        style="font-size: clamp(18px, 4vw, 26px); line-height: 1.35; font-weight: 400; min-height: 54px;"
      >
        <span id="typed-text"></span><span id="cursor" class="cursor-blink ml-[2px] inline-block h-[1.1em] w-[2px] bg-black align-middle"></span>
      </p>

      <!-- Action pills -->
      <div
        id="pills"
        class="flex flex-wrap gap-y-1 opacity-0 translate-y-2"
        style="transition: opacity 0.4s ease, transform 0.4s ease;"
      >
        <a href="#experience" class="mx-[0.2em] mb-[0.4em] inline-flex items-center justify-center whitespace-nowrap rounded-full border border-black/10 bg-white px-4 py-[0.3em] text-[13px] text-black transition-colors duration-200 hover:bg-black hover:text-white sm:px-5 sm:text-[15px]">View experience</a>
        <a href="#skills" class="mx-[0.2em] mb-[0.4em] inline-flex items-center justify-center whitespace-nowrap rounded-full border border-black/10 bg-white px-4 py-[0.3em] text-[13px] text-black transition-colors duration-200 hover:bg-black hover:text-white sm:px-5 sm:text-[15px]">Explore skills</a>
        <a href="#certifications" class="mx-[0.2em] mb-[0.4em] inline-flex items-center justify-center whitespace-nowrap rounded-full border border-black/10 bg-white px-4 py-[0.3em] text-[13px] text-black transition-colors duration-200 hover:bg-black hover:text-white sm:px-5 sm:text-[15px]">See certifications</a>
        <a href="#education" class="mx-[0.2em] mb-[0.4em] inline-flex items-center justify-center whitespace-nowrap rounded-full border border-black/10 bg-white px-4 py-[0.3em] text-[13px] text-black transition-colors duration-200 hover:bg-black hover:text-white sm:px-5 sm:text-[15px]">Education path</a>

        <!-- Contact / email pill -->
        <button
          id="email-pill"
          class="mx-[0.2em] mb-[0.4em] inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full border border-white bg-transparent px-4 py-[0.3em] text-[13px] text-white transition-colors duration-200 hover:bg-white hover:text-black sm:gap-3 sm:px-5 sm:text-[15px]"
        >
          <span>Reach me: <span class="underline underline-offset-1">won93lee@proton.me</span></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copied-label" class="ml-1 text-[11px] opacity-80 hidden">Copied!</span>
        </button>
      </div>
    </div>
  </section>

  <script>
    const EMAIL = 'won93lee@proton.me';
    const SENSITIVITY = 0.8;
    const TYPEWRITER_TEXT = "Glad you stopped in. Over 10 years shaping IT operations, governance, and infrastructure in regulated environments. Now, what are we building?";
    const TYPE_SPEED = 38;
    const TYPE_DELAY = 600;

    // ---------- Typewriter ----------
    const typedEl = document.getElementById('typed-text');
    const cursorEl = document.getElementById('cursor');
    let i = 0;
    setTimeout(() => {
      const interval = setInterval(() => {
        i++;
        typedEl.textContent = TYPEWRITER_TEXT.slice(0, i);
        if (i >= TYPEWRITER_TEXT.length) {
          clearInterval(interval);
          cursorEl.style.display = 'none';
        }
      }, TYPE_SPEED);
    }, TYPE_DELAY);

    // ---------- Pills fade-in ----------
    setTimeout(() => {
      const pills = document.getElementById('pills');
      pills.style.opacity = '1';
      pills.style.transform = 'translateY(0)';
    }, 400);

    // ---------- Copy email ----------
    function copyEmail() {
      navigator.clipboard.writeText(EMAIL).then(() => {
        const label = document.getElementById('copied-label');
        label.classList.remove('hidden');
        setTimeout(() => label.classList.add('hidden'), 2000);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = EMAIL;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const label = document.getElementById('copied-label');
        label.classList.remove('hidden');
        setTimeout(() => label.classList.add('hidden'), 2000);
      });
    }
    document.getElementById('desktop-contact').addEventListener('click', (e) => {
      e.preventDefault();
      copyEmail();
    });
    document.getElementById('mobile-contact').addEventListener('click', () => {
      copyEmail();
      closeMenu();
    });
    document.getElementById('email-pill').addEventListener('click', copyEmail);

    // ---------- Mobile menu ----------
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');
    const barTop = document.getElementById('bar-top');
    const barMid = document.getElementById('bar-mid');
    const barBot = document.getElementById('bar-bot');
    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
      mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
      barTop.style.transform = 'translateY(7px) rotate(45deg)';
      barMid.style.opacity = '0';
      barBot.style.transform = 'translateY(-7px) rotate(-45deg)';
    }
    function closeMenu() {
      menuOpen = false;
      mobileMenu.classList.add('opacity-0', 'pointer-events-none');
      mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
      barTop.style.transform = '';
      barMid.style.opacity = '';
      barBot.style.transform = '';
    }
    hamburger.addEventListener('click', () => {
      menuOpen ? closeMenu() : openMenu();
    });
    document.querySelectorAll('.mobile-link').forEach((el) => {
      el.addEventListener('click', closeMenu);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) closeMenu();
    });

    // ---------- Video mouse-scrub ----------
    const video = document.getElementById('bg-video');
    let prevX = null;
    let targetTime = 0;
    let seeking = false;

    function performSeek() {
      if (!video || seeking || !video.duration || isNaN(video.duration)) return;
      const clamped = Math.max(0, Math.min(targetTime, video.duration));
      if (Math.abs(video.currentTime - clamped) < 0.01) return;
      seeking = true;
      video.currentTime = clamped;
    }

    video.addEventListener('seeked', () => {
      seeking = false;
      if (Math.abs(video.currentTime - targetTime) > 0.02) {
        performSeek();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!video || !video.duration) return;
      if (prevX === null) {
        prevX = e.clientX;
        return;
      }
      const delta = e.clientX - prevX;
      prevX = e.clientX;
      const offset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      targetTime = Math.max(0, Math.min(video.duration, targetTime + offset));
      performSeek();
    });
  </script>
</body>
</html>
